name: Sync to Hugging Face hub
on:
  push:
    branches: [main]

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push squashed snapshot to hub
        env:
          HF: ${{ secrets.HF_TOKEN }}
          HFUSER: ${{ secrets.HFUSER }}
        run: |
          # Push a single squashed commit of the current tree rather than
          # full history, so files that were ever committed and later
          # removed (e.g. the model binary, downloaded at runtime instead)
          # never reach the Space -- the Hub rejects non-LFS binaries.
          git checkout --orphan hf-sync
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from GitHub"
          git push --force "https://$HFUSER:$HF@huggingface.co/spaces/$HFUSER/contactless-vitals-demo" hf-sync:main
