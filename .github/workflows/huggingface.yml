name: Sync to Hugging Face hub
on:
  push:
    branches: [main]

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - name: Push squashed snapshot to hub
        env:
          HF: ${{ secrets.HF_TOKEN }}
          HFUSER: ${{ secrets.HFUSER }}
        run: |
          # Push a single squashed commit of the current tree rather than
          # full history: an early commit on this branch has the model
          # binary as a plain (non-LFS) blob, which the Hub rejects, and
          # squashing keeps that commit out of what's sent to the Space.
          git lfs install --local
          git checkout --orphan hf-sync
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from GitHub"
          git push --force "https://$HFUSER:$HF@huggingface.co/spaces/$HFUSER/contactless-vitals-demo" hf-sync:main
